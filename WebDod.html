<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сторінка селфі</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }

        .container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        video {
            width: 100%;
            max-width: 500px;
            border-radius: 8px;
            background: #000;
        }

        .controls {
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background 0.3s;
        }

            button:hover {
                background-color: #0056b3;
            }
        canvas {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Зробити фото</h2>

        <video id="webcam" autoplay playsinline></video>

        <div class="controls">
            <button id="snap">Зберегти як графічний файл</button>
        </div>

        <canvas id="canvas"></canvas>
    </div>

    <script src="WebDodLog.js"></script>

</body>
</html>
